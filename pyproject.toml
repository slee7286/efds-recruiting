[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recruiting-intelligence"
version = "0.3.0"
description = "Private, provenance-first recruiting intelligence system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "playwright>=1.50,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "python-slugify>=8.0,<9",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "tomli>=2,<3; python_version < '3.11'",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.16,<1",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
  "pyinstaller>=6.0,<7",
]

[project.scripts]
quant-recruiting = "quant_recruiting.cli:app"
recruiting = "quant_recruiting.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_recruiting"]

[tool.alembic]
script_location = "migrations"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
plugins = []
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
